<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ink Aural — 初回セットアップ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Segoe UI', 'Noto Sans JP', sans-serif;
      font-size: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 32px 40px 28px;
      overflow: hidden;
    }

    /* ── ロゴ ── */
    .logo {
      font-family: Georgia, serif;
      font-size: 22px;
      color: #c9a84c;
      letter-spacing: 0.12em;
      margin-bottom: 6px;
    }
    .logo span { color: #888; font-size: 13px; letter-spacing: 0.05em; }

    .subtitle {
      color: #666;
      font-size: 12px;
      margin-bottom: 28px;
      letter-spacing: 0.04em;
    }

    /* ── ステップリスト ── */
    .steps {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: #111;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 11px 14px;
      transition: border-color 0.2s;
    }
    .step.running { border-color: #c9a84c44; }
    .step.ok      { border-color: #4caf5044; }
    .step.error   { border-color: #f4433644; }
    .step.skip    { border-color: #33333388; }

    .step-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      margin-top: 1px;
    }
    .step.pending  .step-icon { color: #444; }
    .step.running  .step-icon { color: #c9a84c; }
    .step.ok       .step-icon { color: #4caf50; }
    .step.error    .step-icon { color: #f44336; }
    .step.skip     .step-icon { color: #555; }

    .step-body { flex: 1; min-width: 0; }
    .step-title {
      font-size: 13px;
      font-weight: 600;
      color: #ccc;
      margin-bottom: 2px;
    }
    .step.ok    .step-title { color: #81c784; }
    .step.error .step-title { color: #e57373; }
    .step.skip  .step-title { color: #555; }

    .step-msg {
      font-size: 11px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 500px;
      min-height: 14px;
    }
    .step.running .step-msg { color: #c9a84c99; }
    .step.ok      .step-msg { color: #4a7a4c; }
    .step.error   .step-msg {
      color: #c0392b;
      white-space: normal;
      font-size: 11px;
      line-height: 1.5;
    }

    /* ── spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #c9a84c44;
      border-top-color: #c9a84c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* ── ログウィンドウ ── */
    .log-box {
      width: 100%;
      background: #0d0d0d;
      border: 1px solid #1e1e1e;
      border-radius: 5px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #555;
      height: 80px;
      overflow-y: auto;
      padding: 8px 10px;
      margin-bottom: 18px;
      line-height: 1.6;
    }
    .log-box .log-line { color: #666; }
    .log-box .log-line.err { color: #c0392b; }

    /* ── ボタン ── */
    .btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: flex-end;
    }

    button {
      padding: 9px 22px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    #btn-start {
      background: #c9a84c;
      color: #0a0a0a;
    }
    #btn-start:hover:not(:disabled) { background: #dbb95a; }

    #btn-skip {
      background: #1a1a1a;
      color: #777;
      border: 1px solid #333;
    }
    #btn-skip:hover:not(:disabled) { color: #aaa; border-color: #555; }

    #btn-open {
      background: #1e3a1e;
      color: #81c784;
      border: 1px solid #2e5e2e;
      display: none;
    }
    #btn-open:hover { background: #254a25; }

    /* ── 完了バナー ── */
    .done-banner {
      display: none;
      width: 100%;
      background: #0d1f0d;
      border: 1px solid #2e5e2e;
      border-radius: 6px;
      padding: 12px 16px;
      color: #81c784;
      font-size: 13px;
      text-align: center;
      margin-bottom: 14px;
    }
    .done-banner.show { display: block; }
  </style>
</head>
<body>
  <div class="logo">INK AURAL <span>by Ink Inc.</span></div>
  <div class="subtitle">初回セットアップ — 必要な環境を自動インストールします</div>

  <div class="steps" id="steps">
    <!-- JS で生成 -->
  </div>

  <div class="log-box" id="log-box"></div>

  <div class="done-banner" id="done-banner">
    ✅ セットアップが完了しました。Ink Aural を起動します。
  </div>

  <div class="btn-row">
    <button id="btn-skip">スキップ（手動セットアップ）</button>
    <button id="btn-start">セットアップ開始</button>
    <button id="btn-open">Ink Aural を起動 →</button>
  </div>

  <script src="setup.js"></script>
</body>
</html>
